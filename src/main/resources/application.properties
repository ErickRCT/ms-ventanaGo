spring.application.name=ms-ventanaGo
server.address=0.0.0.0
server.port=7099

# Valores reales de la BD: variables de entorno DB_URL, DB_USER y DB_PASSWORD,
# o un archivo local application-local.properties (ignorado por git; ver application-example.properties).
spring.config.import=optional:classpath:application-local.properties

# URL de conexion a la base de datos
spring.datasource.url=${DB_URL}

# Credenciales de la base de datos
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver de conexion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA (opcional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Las relaciones LAZY se cargan al serializar en los controladores
spring.jpa.open-in-view=true

# Configuracion thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Los mensajes de error (p. ej. "Código incorrecto.") llegan al front
server.error.include-message=always
# DevTools activa el stack trace en las respuestas; nunca debe llegar al navegador
server.error.include-stacktrace=never

# Autenticacion (valores reales por variables de entorno o application-local.properties):
#   APP_JWT_SECRET               secreto de al menos 32 caracteres para firmar los tokens
#   APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD   cuenta de administrador que se crea al arrancar si no existe
#   APP_GOOGLE_CLIENT_ID         client ID de Google Cloud para "Iniciar sesión con Google"
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD  para enviar los códigos por correo
app.jwt.duracion-horas=12
# Correo para los codigos de acceso. Se activa solo cuando hay spring.mail.host:
#   local:      application-local.properties
#   produccion: variables de entorno SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
#               (opcional APP_MAIL_REMITENTE; por defecto se usa SPRING_MAIL_USERNAME)
# Sin spring.mail.host el codigo se escribe en el log en vez de enviarse.
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
