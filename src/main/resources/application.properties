spring.application.name=ms-ventanaGo
server.address=0.0.0.0
server.port=7099

# Valores reales de la BD: variables de entorno DB_URL, DB_USER y DB_PASSWORD,
# o un archivo local application-local.properties (ignorado por git; ver application-example.properties).
spring.config.import=optional:classpath:application-local.properties

# URL de conexion a la base de datos
spring.datasource.url=${DB_URL}

# Credenciales de la base de datos
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver de conexion
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA (opcional)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML5