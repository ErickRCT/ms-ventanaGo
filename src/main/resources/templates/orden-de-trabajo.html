<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Cotización</title>
    <style>
        @page {
            size: A4; /* O usa letter si prefieres */
            margin-left: 20px;
            margin-right: 20px;
        }

        body{
            font-family: Comic Sans,'Arial Narrow',serif;
        }

        tbody tr:nth-child(even) td {
            background-color: #f2f2f2;
        }

        tbody tr:nth-child(odd) td {
            background-color: #ffffff;
        }
    </style>
</head>

<body>
<table border="0" width="100%">
    <tr>
        <td width="50%">
            <img src="https://www.diprotec.cl/wp-content/uploads/2025/02/imagen_2025-02-26_131502104.png" height="50" width="100"/>
            <h2 >Orden De Trabajo <span th:text="${cotizacion.cotizacionId}"></span></h2>
        </td>
    </tr>
</table>
<table border="0" width="100%" cellspacing="0" cellpadding="0" style="font-size: 14px;" >
    <tr>
        <td width="50%">
            <p style="font-size: 12px;margin-bottom: 0">Cliente:</p>
        </td>
        <td width="50%" align="right">
            <span style="font-size: 14px;margin-bottom: 0" th:text="${#temporals.format(cotizacion.fecha, 'dd ''de'' MMMM ''de'' yyyy')}"></span>
        </td>
    </tr>
    <tr style="background-color: #f6f6f6;">
        <td width="" style="padding-bottom: 10px;padding-top: 5px;border-top: 2px solid #ccc;font-size: 12px">
            <strong>
                <span th:text="${cotizacion.cliente.nombre}"></span>
            </strong>
        </td>
        <!-- Es vacio este solo para rellenar el espacio a la derecha-->
        <td width="" style="padding-bottom: 10px;padding-top: 5px;border-top: 2px solid #ccc;font-size: 12px"></td>
    </tr>
</table>

<table border="0" width="100%" cellspacing="10" style="font-size: 14px; margin-top: 30px">
   <tr>
       <td>
           <table border="0" style="font-size: 12px;" >
               <tr th:each="ventana : ${cotizacion.ventanas}">
                   <td width="25%" style="vertical-align: top;">
                       <table cellspacing="0" border="0" style="font-size: 12px;">
                           <tr>
                               <th>Producto</th>
                           </tr>
                           <tr>
                               <td style="border-bottom: 1px solid #dad9d9;">Item:</td>
                               <td style="border-bottom: 1px solid #dad9d9;">
                                   <span th:text="${ventana.descripcion}"></span>
                               </td>
                           </tr>
                           <tr>
                               <td colspan="2" style="white-space: nowrap; overflow: hidden;">
                                   <strong>
                                       <span th:text="${ventana.pauta.nombre}"></span>
                                   </strong>
                               </td>
                           </tr>
                           <tr>
                               <td>
                                   <strong>
                                       <span th:text="${ventana.pauta.serie.nombre}"></span>
                                   </strong>
                               </td>
                           </tr>
                           <tr>
                               <td>Ancho:</td>
                               <td>
                                   <strong>
                                       <span th:text="${#numbers.formatInteger(ventana.ancho, 3, 'POINT')}"></span>mm
                                   </strong>
                               </td>
                           </tr>
                           <tr>
                               <td>Alto</td>
                               <td>
                                   <strong>
                                       <span th:text="${#numbers.formatInteger(ventana.alto, 3, 'POINT')}"></span>mm
                                   </strong>
                               </td>
                           </tr>
                           <tr>
                               <td>
                                   <strong>
                                       <span th:text="${ventana.color.nombre}"></span>
                                   </strong>
                               </td>
                           </tr>
                           <tr>
                               <td>
                                   <strong>
                                       <span th:text="${ventana.vidrio.nombre}"></span>
                                   </strong>
                               </td>
                           </tr>
                           <tr>
                               <td style="horiz-align: center;">
                                   <img src="https://www.diprotec.cl/wp-content/uploads/2025/02/imagen_2025-02-26_141210852.png" width="120" height="100"/>
                               </td>
                           </tr>
                       </table>
                   </td>
                   <td style="vertical-align: top;">
                       <table style="width: 100%; border-collapse: collapse; table-layout: fixed;">
                           <tr>
                               <th style="width: 80%; text-align: left;">Descripción</th>
                               <th style="width: 10%; text-align: right;">Cantidad</th>
                               <th style="width: 10%; text-align: right;">mm</th>
                           </tr>

                           <!-- Seccion de Perfileria -->
                           <tr>
                               <th colspan="3" style="text-align: left; background-color: #ddd;">PERFILERÍA</th>
                           </tr>
                           <tr th:each="pautaPerfil : ${ventana.pauta.perfiles}">
                               <td th:text="${pautaPerfil.perfil.codigo} + ' - ' + ${pautaPerfil.perfil.tipoPerfil.nombre}"></td>
                               <td th:text="${pautaPerfil.cantidad}" style="text-align: right;"></td>
                               <td th:text="${pautaPerfil.orientacion == 'H' ?  (ventana.ancho + pautaPerfil.variacion ) : ( ventana.alto + pautaPerfil.variacion ) }" style="text-align: right;"></td>
                           </tr>

                           <!-- Seccion de Quincalleria -->
                           <tr>
                               <th colspan="3" style="text-align: left; background-color: #ddd;">QUINCALLERÍA</th>
                           </tr>
                           <tr th:each="pautaQuincalleria : ${ventana.pauta.quincallerias}">
                               <td th:text="${pautaQuincalleria.quincalleria.nombre}" ></td>
                               <td th:text="${ pautaQuincalleria.quincalleria.unidad == 'Mt' ? (ventana.ancho * pautaQuincalleria.variacionH) + (ventana.alto * pautaQuincalleria.variacionV) + 'Mt' : (pautaQuincalleria.cantidad) + 'Pz' }" style="text-align: right;"></td>
                               <td></td>
                           </tr>

                           <!-- Seccion de Vidrios -->
                           <tr>
                               <th colspan="3" style="text-align: left; background-color: #ddd;">VIDRIOS</th>
                           </tr>
                           <tr th:each="pautaVidrio : ${ventana.pauta.vidrios}">
                               <td th:text="${ventana.vidrio.nombre}"></td>
                               <td th:text="${pautaVidrio.cantidad}" style="text-align: right;"></td>
                               <td></td>
                           </tr>
                       </table>
                   </td>
               </tr>
           </table>
       </td>
   </tr>
</table>
</body>
</html>
